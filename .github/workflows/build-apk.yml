name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # Android 17 = API 37; falls back to 36 if 37 isn't published to the SDK repo.
      - name: Install SDK platform
        run: |
          if sdkmanager "platforms;android-37" "build-tools;36.0.0"; then
            echo "Using API 37"
          else
            sdkmanager "platforms;android-36" "build-tools;36.0.0"
            sed -i 's/compileSdk = 37/compileSdk = 36/; s/targetSdk = 37/targetSdk = 36/' app/build.gradle.kts
            echo "Fell back to API 36"
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: craterush-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
